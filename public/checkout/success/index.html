<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Order confirmation | TurboMarket</title><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-slate-50 text-slate-900"><main class="min-h-screen flex items-center justify-center p-4"><section class="max-w-xl w-full bg-white border rounded-2xl p-8 text-center shadow-sm"><div id="icon" class="text-5xl">⏳</div><h1 id="title" class="text-3xl font-black mt-4">Confirming payment</h1><p id="message" class="text-slate-600 mt-3">Stripe has returned you to TurboMarket. We are waiting for secure webhook confirmation.</p><div id="details" class="hidden mt-6 text-left bg-slate-50 rounded-xl p-4"></div><div class="flex flex-col sm:flex-row gap-3 mt-7"><a href="/" class="flex-1 bg-blue-600 text-white p-3 rounded-xl font-bold">Back to marketplace</a><a href="/seller/dashboard" class="flex-1 border p-3 rounded-xl font-bold">Seller dashboard</a></div></section></main><script>const q=new URLSearchParams(location.search),order=q.get('order'),session=q.get('session_id');const money=c=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format((Number(c)||0)/100);let attempts=0;async function check(){attempts++;if(!order||!session){document.getElementById('icon').textContent='⚠️';document.getElementById('title').textContent='Missing order information';document.getElementById('message').textContent='We could not verify this return URL.';return}try{const r=await fetch('/api/order-status?order='+encodeURIComponent(order)+'&session_id='+encodeURIComponent(session));const d=await r.json();if(!r.ok)throw new Error(d.error||'Could not verify order');const o=d.order;if(o.payment_status==='paid'){document.getElementById('icon').textContent='✅';document.getElementById('title').textContent='Payment confirmed';document.getElementById('message').textContent='Your order has been stored and the seller has been notified.';const box=document.getElementById('details');box.classList.remove('hidden');box.innerHTML='<p><b>Item:</b> '+o.title+'</p><p><b>Seller:</b> '+o.display_name+'</p><p><b>Quantity:</b> '+o.quantity+'</p><p><b>Total:</b> '+money(o.item_price_cents*o.quantity)+'</p><p><b>Order:</b> '+o.id+'</p>';return}if(o.payment_status==='failed'||o.payment_status==='refunded'){document.getElementById('icon').textContent='⚠️';document.getElementById('title').textContent='Payment not completed';document.getElementById('message').textContent='Order status: '+o.payment_status;return}document.getElementById('message').textContent='Payment received by Stripe. Waiting for webhook confirmation…';if(attempts<15)setTimeout(check,2000);else document.getElementById('message').textContent='Confirmation is taking longer than expected. Your order reference is '+order+'.'}catch(e){document.getElementById('message').textContent=e.message;if(attempts<5)setTimeout(check,2000)}}check();</script></body></html>
