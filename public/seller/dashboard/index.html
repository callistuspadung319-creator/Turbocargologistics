<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Seller Dashboard | TurboMarket</title><script src="https://cdn.tailwindcss.com"></script><style>button,a{touch-action:manipulation}</style></head><body class="bg-slate-50 text-slate-900"><header class="bg-white border-b"><div class="max-w-5xl mx-auto px-4 min-h-16 py-3 flex items-center justify-between gap-3"><a href="/marketplace" class="font-black text-2xl text-blue-700">TurboMarket</a><nav class="flex flex-wrap justify-end gap-3 text-sm sm:text-base"><a href="/marketplace" class="font-semibold">Marketplace</a><a href="/sell/" class="font-bold text-blue-700">List a card</a><a href="/admin" class="font-semibold">Admin</a></nav></div></header><main class="max-w-5xl mx-auto px-4 py-8"><div class="flex flex-wrap justify-between gap-3"><div><h1 class="text-3xl font-black">Seller dashboard</h1><p id="sellerName" class="text-slate-600 mt-1">Loading seller…</p></div><div class="flex gap-2"><button id="copy" disabled class="border bg-white px-4 py-2 rounded-lg font-bold disabled:opacity-50">Copy seller link</button><a href="/sell/" class="bg-blue-600 text-white px-4 py-2 rounded-lg font-bold">Create listing</a></div></div><div id="message" class="hidden mt-5 p-4 rounded-xl"></div><section id="stats" class="grid grid-cols-2 md:grid-cols-4 gap-3 mt-6"><div class="col-span-full bg-white border rounded-xl p-5 text-slate-500">Loading dashboard…</div></section><section class="mt-8"><h2 class="text-2xl font-black mb-3">Your listings</h2><div id="listings" class="space-y-3"><div class="bg-white border rounded-xl p-5 text-slate-500">Loading listings…</div></div></section><section class="mt-8"><h2 class="text-2xl font-black mb-3">Orders</h2><div id="orders" class="bg-white border rounded-xl overflow-hidden"><div class="p-5 text-slate-500">Loading orders…</div></div></section></main><script>
const money=c=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format((Number(c)||0)/100);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let store='',loading=false;const $=id=>document.getElementById(id);
function show(m,e=false){const x=$('message');x.className='mt-5 p-4 rounded-xl '+(e?'bg-red-50 text-red-700 border border-red-200':'bg-green-50 text-green-700 border border-green-200');x.textContent=m;x.classList.remove('hidden')}
async function fetchJson(url,opt={}){const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),12000);try{const r=await fetch(url,{credentials:'include',cache:'no-store',signal:controller.signal,headers:{'Content-Type':'application/json','Cache-Control':'no-cache',...(opt.headers||{})},...opt});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||d.detail||'Request failed');return d}catch(e){if(e.name==='AbortError')throw new Error('Dashboard request timed out. Tap retry and try again.');throw e}finally{clearTimeout(timer)}}
function table(rows,cols){if(!Array.isArray(rows)||!rows.length)return '<div class="p-5 text-slate-500">No records yet.</div>';return '<div class="overflow-auto"><table class="w-full text-sm"><thead><tr>'+cols.map(c=>'<th class="text-left p-3 bg-slate-50">'+c[0]+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr class="border-t">'+cols.map(c=>'<td class="p-3">'+c[1](r)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>'}
function listingCards(rows){if(!Array.isArray(rows)||!rows.length)return '<div class="bg-white border rounded-xl p-5 text-slate-500">No listings yet.</div>';return rows.map(r=>`<article class="bg-white border rounded-xl p-4"><div class="flex gap-3"><img loading="lazy" decoding="async" src="${esc(r.image_url||'https://placehold.co/180x180?text=Card')}" class="w-24 h-24 rounded-lg border object-cover bg-slate-100"><div class="min-w-0 flex-1"><h3 class="font-bold text-lg break-words">${esc(r.title||'Untitled listing')}</h3><p class="text-slate-500 mt-1">${money(r.price_cents)} · ${Number(r.quantity)||0} available</p><p class="mt-1 font-semibold ${r.active!==false?'text-green-700':'text-slate-500'}">${r.active!==false?'Active':'Inactive'}</p></div></div><div class="grid grid-cols-3 gap-2 mt-4"><a href="/listing/${encodeURIComponent(r.id)}" class="text-center border rounded-lg px-2 py-3 font-bold text-blue-700">View</a><button data-toggle="${esc(r.id)}" data-active="${r.active!==false?'1':'0'}" class="border rounded-lg px-2 py-3 font-bold">${r.active!==false?'Deactivate':'Activate'}</button><button data-delete="${esc(r.id)}" data-title="${esc(r.title||'listing')}" class="border border-red-300 text-red-700 rounded-lg px-2 py-3 font-bold">Delete</button></div></article>`).join('')}
function bindActions(){document.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=async()=>{if(b.disabled)return;b.disabled=true;try{await fetchJson('/api/marketplace/seller/listings/'+encodeURIComponent(b.dataset.toggle),{method:'PATCH',body:JSON.stringify({active:b.dataset.active!=='1'})});show('Listing status updated.');await load()}catch(e){show(e.message,true)}finally{b.disabled=false}});document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=async()=>{if(b.disabled||!confirm('Delete “'+b.dataset.title+'”? This cannot be undone.'))return;b.disabled=true;try{const d=await fetchJson('/api/listing-delete/'+encodeURIComponent(b.dataset.delete),{method:'DELETE'});show('Listing deleted: '+(d.title||b.dataset.title));await load()}catch(e){show(e.message,true)}finally{b.disabled=false}})}
async function load(){if(loading)return;loading=true;try{const d=await fetchJson('/api/seller-dashboard');const user=d?.user||{},totals=d?.totals||{},display=user.display_name||'Seller',username=user.username||'';$('sellerName').textContent=username?display+' · @'+username:display;store=username?location.origin+'/seller/'+username:'';$('copy').disabled=!store;$('stats').innerHTML=[['Total sales',totals.total_sales],['Pending payout',totals.pending_payout],['Paid payout',totals.paid_payout],['Platform fees',totals.platform_fees]].map(x=>'<div class="bg-white border rounded-xl p-4"><p class="text-sm text-slate-500">'+x[0]+'</p><b class="text-xl">'+money(x[1])+'</b></div>').join('');$('listings').innerHTML=listingCards(d?.listings||[]);$('orders').innerHTML=table(d?.orders||[],[['Order',r=>esc(r.id)],['Item',r=>esc(r.title)],['Payment',r=>esc(r.payment_status)],['Fulfillment',r=>esc(r.fulfillment_status)]]);bindActions()}catch(e){show(e.message,true);$('sellerName').textContent='Seller unavailable';$('stats').innerHTML='<div class="col-span-full bg-red-50 border border-red-200 rounded-xl p-5 text-red-700">'+esc(e.message)+'</div>';$('listings').innerHTML='<div class="bg-white border rounded-xl p-5"><button onclick="location.reload()" class="bg-blue-600 text-white px-4 py-3 rounded-lg font-bold">Retry dashboard</button></div>';if(/login required/i.test(e.message))setTimeout(()=>location.href='/login',1200)}finally{loading=false}}
$('copy').onclick=async()=>{if(!store)return;try{await navigator.clipboard.writeText(store);show('Seller link copied: '+store)}catch{show('Copy failed. Open this link: '+store,true)}};window.addEventListener('pageshow',e=>{if(e.persisted)load()});load();
</script></body></html>
