<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Seller Dashboard | TurboMarket</title><script src="https://cdn.tailwindcss.com"></script><style>button,a{touch-action:manipulation}</style></head><body class="bg-slate-50 text-slate-900"><header class="bg-white border-b"><div class="max-w-5xl mx-auto px-4 min-h-16 py-3 flex items-center justify-between gap-3"><a href="/" class="font-black text-2xl text-blue-700">TurboMarket</a><div class="flex flex-wrap justify-end gap-3 text-sm sm:text-base"><a href="/" class="font-semibold">Marketplace</a><a href="/sell/" class="font-bold text-blue-700">List a card</a><a href="/admin" class="font-semibold">Admin</a></div></div></header><main class="max-w-5xl mx-auto px-4 py-8"><div class="flex flex-wrap justify-between gap-3"><div><h1 class="text-3xl font-black">Seller dashboard</h1><p id="sellerName" class="text-slate-600 mt-1">Loading seller…</p></div><div class="flex gap-2"><button id="copy" class="border bg-white px-4 py-2 rounded-lg font-bold">Copy seller link</button><a href="/sell/" class="bg-blue-600 text-white px-4 py-2 rounded-lg font-bold">Create listing</a></div></div><div id="message" class="hidden mt-5 p-4 rounded-xl"></div><section id="stats" class="grid grid-cols-2 md:grid-cols-4 gap-3 mt-6"></section><section class="mt-8"><h2 class="text-2xl font-black mb-3">Your listings</h2><div id="listings" class="space-y-3"></div></section><section class="mt-8"><h2 class="text-2xl font-black mb-3">Orders</h2><div id="orders" class="bg-white border rounded-xl overflow-hidden"></div></section></main><script>const money=c=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format((Number(c)||0)/100);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let store='';function show(m,e=false){const x=document.getElementById('message');x.className='mt-5 p-4 rounded-xl '+(e?'bg-red-50 text-red-700 border border-red-200':'bg-green-50 text-green-700 border border-green-200');x.textContent=m;scrollTo({top:0,behavior:'smooth'})}async function sellerApi(path,opt={}){const r=await fetch('/api/seller-tools'+path,{credentials:'include',headers:{'Content-Type':'application/json'},...opt}),d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||d.detail||'Request failed');return d}async function marketApi(path,opt={}){const r=await fetch('/api/marketplace'+path,{credentials:'include',headers:{'Content-Type':'application/json'},...opt}),d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||d.detail||'Request failed');return d}function table(rows,cols){if(!rows.length)return '<div class="p-5 text-slate-500">No records yet.</div>';return '<div class="overflow-auto"><table class="w-full text-sm"><thead><tr>'+cols.map(c=>'<th class="text-left p-3 bg-slate-50">'+c[0]+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr class="border-t">'+cols.map(c=>'<td class="p-3">'+c[1](r)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>'}function listingCards(rows){if(!rows.length)return '<div class="bg-white border rounded-xl p-5 text-slate-500">No listings yet.</div>';return rows.map(r=>`<article class="bg-white border rounded-xl p-4"><div class="flex gap-3"><img src="${esc(r.image_url||'https://placehold.co/180x180?text=Card')}" class="w-24 h-24 rounded-lg border object-cover bg-slate-100"><div class="min-w-0 flex-1"><h3 class="font-bold text-lg break-words">${esc(r.title)}</h3><p class="text-slate-500 mt-1">${money(r.price_cents)} · ${Number(r.quantity)||0} available</p><p class="mt-1 font-semibold ${r.active?'text-green-700':'text-slate-500'}">${r.active?'Active':'Inactive'}</p></div></div><div class="grid grid-cols-3 gap-2 mt-4"><a href="/item/?id=${encodeURIComponent(r.id)}" class="text-center border rounded-lg px-2 py-3 font-bold text-blue-700">View</a><button data-toggle="${esc(r.id)}" data-active="${r.active?'1':'0'}" class="border rounded-lg px-2 py-3 font-bold">${r.active?'Deactivate':'Activate'}</button><button data-delete="${esc(r.id)}" data-title="${esc(r.title)}" class="border border-red-300 text-red-700 rounded-lg px-2 py-3 font-bold">Delete</button></div></article>`).join('')}async function load(){try{const d=await sellerApi('/dashboard');document.getElementById('sellerName').textContent=d.user.display_name+' · @'+d.user.username;store=location.origin+'/seller/'+d.user.username;document.getElementById('stats').innerHTML=[['Total sales',d.totals.total_sales],['Pending payout',d.totals.pending_payout],['Paid payout',d.totals.paid_payout],['Platform fees',d.totals.platform_fees]].map(x=>'<div class="bg-white border rounded-xl p-4"><p class="text-sm text-slate-500">'+x[0]+'</p><b class="text-xl">'+money(x[1])+'</b></div>').join('');document.getElementById('listings').innerHTML=listingCards(d.listings);document.getElementById('orders').innerHTML=table(d.orders,[['Order',r=>esc(r.id)],['Item',r=>esc(r.title)],['Payment',r=>esc(r.payment_status)],['Fulfillment',r=>esc(r.fulfillment_status)]]);document.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=async()=>{b.disabled=true;try{await marketApi('/seller/listings/'+b.dataset.toggle,{method:'PATCH',body:JSON.stringify({active:b.dataset.active!=='1'})});show('Listing status updated.');await load()}catch(e){show(e.message,true);b.disabled=false}});document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=async()=>{if(!confirm('Delete “'+b.dataset.title+'”? This cannot be undone.'))return;b.disabled=true;try{const r=await fetch('/api/listing-delete/'+encodeURIComponent(b.dataset.delete),{method:'DELETE',credentials:'include'});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||d.detail||'Delete failed');show('Listing deleted.');await load()}catch(e){show(e.message,true);b.disabled=false}})}catch(e){show(e.message,true);if(e.message==='Login required')setTimeout(()=>location.href='/login',1000)}}document.getElementById('copy').onclick=async()=>{if(!store)return;await navigator.clipboard.writeText(store);show('Seller link copied: '+store)};load();</script></body></html>
