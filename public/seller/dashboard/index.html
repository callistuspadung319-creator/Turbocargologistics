<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Seller Dashboard | TurboMarket</title><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-slate-50 text-slate-900"><header class="bg-white border-b"><div class="max-w-5xl mx-auto px-4 h-16 flex items-center justify-between"><a href="/" class="font-black text-2xl text-blue-700">TurboMarket</a><div class="flex gap-4"><a href="/sell/" class="font-bold text-blue-700">List a card</a><a href="/admin" class="font-semibold">Admin</a></div></div></header><main class="max-w-5xl mx-auto px-4 py-8"><div class="flex flex-wrap justify-between gap-3"><div><h1 class="text-3xl font-black">Seller dashboard</h1><p id="sellerName" class="text-slate-600 mt-1">Loading seller…</p></div><div class="flex gap-2"><button id="copy" class="border bg-white px-4 py-2 rounded-lg font-bold">Copy seller link</button><a href="/sell/" class="bg-blue-600 text-white px-4 py-2 rounded-lg font-bold">Create listing</a></div></div><div id="message" class="hidden mt-5 p-4 rounded-xl"></div><section id="stats" class="grid grid-cols-2 md:grid-cols-4 gap-3 mt-6"></section><section class="mt-8"><h2 class="text-xl font-black mb-3">Your listings</h2><div id="listings" class="bg-white border rounded-xl overflow-hidden"></div></section><section class="mt-8"><h2 class="text-xl font-black mb-3">Orders</h2><div id="orders" class="bg-white border rounded-xl overflow-hidden"></div></section></main><script>const money=c=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format((Number(c)||0)/100);let store='';function show(m,e=false){const x=document.getElementById('message');x.className='mt-5 p-4 rounded-xl '+(e?'bg-red-50 text-red-700':'bg-green-50 text-green-700');x.textContent=m}async function api(path){const r=await fetch('/api/seller-tools'+path,{credentials:'include'}),d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||d.detail||'Request failed');return d}function table(rows,cols){if(!rows.length)return '<div class="p-5 text-slate-500">No records yet.</div>';return '<div class="overflow-auto"><table class="w-full text-sm"><thead><tr>'+cols.map(c=>'<th class="text-left p-3 bg-slate-50">'+c[0]+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr class="border-t">'+cols.map(c=>'<td class="p-3">'+c[1](r)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>'}api('/dashboard').then(d=>{document.getElementById('sellerName').textContent=d.user.display_name+' · @'+d.user.username;store=location.origin+'/seller/'+d.user.username;document.getElementById('stats').innerHTML=[['Total sales',d.totals.total_sales],['Pending payout',d.totals.pending_payout],['Paid payout',d.totals.paid_payout],['Platform fees',d.totals.platform_fees]].map(x=>'<div class="bg-white border rounded-xl p-4"><p class="text-sm text-slate-500">'+x[0]+'</p><b class="text-xl">'+money(x[1])+'</b></div>').join('');document.getElementById('listings').innerHTML=table(d.listings,[['Listing',r=>r.title],['Price',r=>money(r.price_cents)],['Quantity',r=>r.quantity],['Status',r=>r.active?'Active':'Inactive']]);document.getElementById('orders').innerHTML=table(d.orders,[['Order',r=>r.id],['Item',r=>r.title],['Payment',r=>r.payment_status],['Fulfillment',r=>r.fulfillment_status]])}).catch(e=>{show(e.message,true);if(e.message==='Login required')setTimeout(()=>location.href='/login',1000)});document.getElementById('copy').onclick=async()=>{if(!store)return;await navigator.clipboard.writeText(store);show('Seller link copied: '+store)}</script></body></html>
