<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sell a card | TurboMarket</title><script src="https://cdn.tailwindcss.com"></script><style>body{background:#f8fafc}input,select,textarea{font-size:16px!important}</style></head>
<body class="text-slate-900">
<header class="sticky top-0 z-20 bg-white border-b"><div class="max-w-4xl mx-auto h-16 px-4 flex items-center justify-between"><a href="/" class="font-black text-2xl text-blue-700">TurboMarket</a><div class="flex gap-4"><a href="/seller/dashboard/" class="font-semibold">Dashboard</a><a href="/admin" class="font-semibold">Admin</a></div></div></header>
<main class="max-w-3xl mx-auto px-4 py-8">
<div class="mb-6"><h1 class="text-3xl font-black">List a sports card</h1><p class="text-slate-600 mt-2">Upload a photo from your phone, check verified comps, then publish.</p></div>
<div id="status" class="hidden mb-4 p-4 rounded-xl"></div>
<section class="bg-white border rounded-2xl p-5 shadow-sm">
<form id="form" class="space-y-5">
<div><label class="font-bold block mb-2">Card photo</label><label class="block border-2 border-dashed rounded-xl p-5 text-center cursor-pointer bg-slate-50"><input id="photos" type="file" accept="image/*" capture="environment" multiple class="hidden"><span class="text-blue-700 font-bold">Take photo or choose from library</span><p class="text-sm text-slate-500 mt-1">Up to 4 images. Photos are compressed before upload.</p></label><div id="previews" class="grid grid-cols-2 gap-3 mt-3"></div></div>
<div><label class="font-bold block mb-2">Card title</label><input id="title" required class="w-full border p-3 rounded-xl" placeholder="Example: 2023 Prizm Victor Wembanyama Silver PSA 10"></div>
<div class="grid grid-cols-2 gap-3"><div><label class="font-bold block mb-2">Price (USD)</label><input id="price" required type="number" min="0.50" step="0.01" class="w-full border p-3 rounded-xl" placeholder="0.00"></div><div><label class="font-bold block mb-2">Quantity</label><input id="quantity" required type="number" min="1" value="1" class="w-full border p-3 rounded-xl"></div></div>
<div class="grid grid-cols-2 gap-3"><div><label class="font-bold block mb-2">Category</label><select id="category" class="w-full border p-3 rounded-xl"><option>Sports Cards</option><option>Baseball Cards</option><option>Basketball Cards</option><option>Football Cards</option><option>Soccer Cards</option><option>Other Collectibles</option></select></div><div><label class="font-bold block mb-2">Condition</label><select id="condition" class="w-full border p-3 rounded-xl"><option>Raw</option><option>PSA 10</option><option>PSA 9</option><option>BGS 9.5</option><option>SGC 10</option><option>Graded</option><option>Used</option><option>New</option></select></div></div>
<div><label class="font-bold block mb-2">Description</label><textarea id="description" required rows="4" class="w-full border p-3 rounded-xl" placeholder="Year, set, player, card number, parallel, grade, and any flaws"></textarea></div>
<div class="bg-blue-50 border border-blue-200 rounded-xl p-4"><div class="flex items-center justify-between gap-3"><div><h2 class="font-black text-lg">Recent comps</h2><p class="text-sm text-slate-600">Only verified completed marketplace sales are shown. No fake prices.</p></div><button id="checkComps" type="button" class="bg-white border border-blue-300 text-blue-700 px-4 py-2 rounded-lg font-bold">Check comps</button></div><div id="comps" class="mt-4 text-sm text-slate-600">Enter the card title and tap Check comps.</div></div>
<button id="publish" class="w-full bg-blue-600 text-white p-4 rounded-xl font-black text-lg">Publish listing</button>
</form></section>
</main>
<script>
const $=id=>document.getElementById(id);let images=[];
function show(message,type='ok'){const s=$('status');s.className='mb-4 p-4 rounded-xl '+(type==='error'?'bg-red-50 text-red-700 border border-red-200':'bg-green-50 text-green-700 border border-green-200');s.textContent=message;s.classList.remove('hidden')}
async function request(path,opt={}){const r=await fetch('/api/seller-tools'+path,{credentials:'include',headers:{'Content-Type':'application/json'},...opt});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||d.detail||'Request failed');return d}
async function compress(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onerror=reject;reader.onload=()=>{const img=new Image();img.onerror=reject;img.onload=()=>{const max=1200,scale=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext('2d').drawImage(img,0,0,c.width,c.height);resolve(c.toDataURL('image/jpeg',.78))};img.src=reader.result};reader.readAsDataURL(file)})}
$('photos').addEventListener('change',async e=>{try{images=[];$('previews').innerHTML='<p>Processing photos…</p>';for(const f of [...e.target.files].slice(0,4))images.push(await compress(f));$('previews').innerHTML=images.map((src,i)=>`<img src="${src}" class="w-full aspect-square object-cover rounded-xl border" alt="Card image ${i+1}">`).join('')}catch(err){show('Could not process image: '+err.message,'error')}});
$('checkComps').onclick=async()=>{const q=$('title').value.trim();if(q.length<3)return show('Enter the card title first.','error');$('comps').textContent='Checking verified sales…';try{const d=await request('/comps',{method:'POST',body:JSON.stringify({query:q})});if(!d.count){$('comps').innerHTML='<b>No verified sales found yet.</b><br>'+d.message;return}$('comps').innerHTML=`<div class="grid grid-cols-2 sm:grid-cols-4 gap-2"><div class="bg-white p-3 rounded-lg"><small>Last sale</small><b class="block text-lg">$${(d.lastSale/100).toFixed(2)}</b></div><div class="bg-white p-3 rounded-lg"><small>Average</small><b class="block text-lg">$${(d.average/100).toFixed(2)}</b></div><div class="bg-white p-3 rounded-lg"><small>Low</small><b class="block text-lg">$${(d.low/100).toFixed(2)}</b></div><div class="bg-white p-3 rounded-lg"><small>High</small><b class="block text-lg">$${(d.high/100).toFixed(2)}</b></div></div><p class="mt-2">${d.count} verified sale(s) · ${d.source}</p>`}catch(err){$('comps').textContent=err.message}};
$('form').onsubmit=async e=>{e.preventDefault();if(!images.length)return show('Upload at least one card photo.','error');const button=$('publish');button.disabled=true;button.textContent='Publishing…';try{const d=await request('/listings',{method:'POST',body:JSON.stringify({title:$('title').value,price:$('price').value,quantity:$('quantity').value,category:$('category').value,condition:$('condition').value,description:$('description').value,images})});show('Listing published successfully.');setTimeout(()=>location.href=d.storefront,900)}catch(err){show(err.message,'error');button.disabled=false;button.textContent='Publish listing'}};
request('/profile').then(d=>{if(!d.seller)show('Seller profile could not be created.','error')}).catch(e=>{show(e.message==='Login required'?'Please log in first.':e.message,'error');if(e.message==='Login required')setTimeout(()=>location.href='/login',1200)});
</script></body></html>
