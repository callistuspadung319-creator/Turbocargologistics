<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Turbo Market</title><script src="https://cdn.tailwindcss.com"></script><script src="https://unpkg.com/react@18/umd/react.production.min.js"></script><script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script><script src="https://unpkg.com/@babel/standalone/babel.min.js"></script><style>body{background:#f8fafc}.line-clamp-2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}</style></head>
<body><div id="root"></div><script type="text/babel">
const {useEffect,useState}=React; const API='/api/marketplace';
const money=c=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format((Number(c)||0)/100);
async function api(path,opt={}){const r=await fetch(API+path,{credentials:'include',headers:{'Content-Type':'application/json',...(opt.headers||{})},...opt});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Request failed');return d}
const go=p=>{history.pushState({},'',p);dispatchEvent(new PopStateEvent('popstate'))};
function Layout({user,setUser,children}){return <><header className="sticky top-0 z-20 bg-white border-b"><div className="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between"><button onClick={()=>go('/')} className="font-black text-2xl text-blue-700">TurboMarket</button><nav className="flex gap-3 items-center text-sm"><button onClick={()=>go('/sell')} className="font-semibold">Sell</button>{user?.role==='admin'&&<button onClick={()=>go('/admin')} className="font-semibold">Admin</button>}{user?<><button onClick={()=>go('/seller/dashboard')} className="font-semibold">Dashboard</button><button onClick={async()=>{await api('/logout',{method:'POST'});setUser(null);go('/')}} className="bg-slate-900 text-white px-3 py-2 rounded-lg">Logout</button></>:<button onClick={()=>go('/login')} className="bg-blue-600 text-white px-3 py-2 rounded-lg">Login</button>}</nav></div></header><main>{children}</main><footer className="mt-16 border-t bg-white p-8 text-center text-sm text-slate-500">© 2026 TurboMarket. Secure multi-seller marketplace.</footer></>}
function Card({x}){return <article className="bg-white rounded-xl border overflow-hidden shadow-sm"><button onClick={()=>go('/listing/'+x.id)} className="w-full text-left"><img className="w-full aspect-square object-cover bg-slate-100" src={x.image_url||'https://placehold.co/600x600?text=Item'} /><div className="p-4"><h3 className="font-semibold line-clamp-2 min-h-12">{x.title}</h3><p className="text-xs text-slate-500 mt-1">{x.condition} · {x.display_name||''}</p><p className="text-xl font-black mt-2">{money(x.price_cents)}</p></div></button><button onClick={()=>go('/listing/'+x.id)} className="m-4 mt-0 w-[calc(100%-2rem)] bg-blue-600 text-white py-2 rounded-lg font-bold">Buy Now</button></article>}
function Home(){const [items,setItems]=useState([]),[q,setQ]=useState(''),[cat,setCat]=useState('');useEffect(()=>{api('/listings?q='+encodeURIComponent(q)+'&category='+encodeURIComponent(cat)).then(setItems).catch(()=>setItems([]))},[q,cat]);return <div><section className="bg-gradient-to-r from-blue-700 to-indigo-700 text-white py-14"><div className="max-w-5xl mx-auto px-4 text-center"><h1 className="text-4xl md:text-6xl font-black">Buy and sell simply</h1><p className="mt-3 text-blue-100">Browse trusted sellers and check out instantly.</p><div className="mt-7 flex gap-2 bg-white p-2 rounded-xl"><input value={q} onChange={e=>setQ(e.target.value)} placeholder="Search items" className="flex-1 px-3 text-slate-900 outline-none"/><select value={cat} onChange={e=>setCat(e.target.value)} className="text-slate-900"><option value="">All categories</option><option>Collectibles</option><option>Electronics</option><option>Fashion</option><option>Home</option><option>Other</option></select></div></div></section><section className="max-w-7xl mx-auto px-4 py-10"><h2 className="text-2xl font-bold mb-5">Active listings</h2>{items.length?<div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">{items.map(x=><Card key={x.id} x={x}/>)}</div>:<div className="bg-white border rounded-xl p-12 text-center">No active listings found.</div>}</section></div>}
function Auth({mode,setUser}){const [f,setF]=useState({email:'',password:'',username:'',displayName:''}),[err,setErr]=useState('');async function submit(e){e.preventDefault();setErr('');try{await api('/'+mode,{method:'POST',body:JSON.stringify(f)});const m=await api('/me');setUser(m.user);go(m.user?.role==='admin'?'/admin':'/seller/dashboard')}catch(e){setErr(e.message)}}return <div className="max-w-md mx-auto p-6 mt-10 bg-white border rounded-xl"><h1 className="text-2xl font-black mb-5">{mode==='login'?'Login':'Create seller account'}</h1><form onSubmit={submit} className="space-y-4">{mode==='register'&&<><input className="w-full border p-3 rounded" placeholder="Display name" onChange={e=>setF({...f,displayName:e.target.value})}/><input className="w-full border p-3 rounded" placeholder="Unique username" onChange={e=>setF({...f,username:e.target.value})}/></>}<input className="w-full border p-3 rounded" type="email" placeholder="Email" onChange={e=>setF({...f,email:e.target.value})}/><input className="w-full border p-3 rounded" type="password" placeholder="Password (8+ characters)" onChange={e=>setF({...f,password:e.target.value})}/>{err&&<p className="text-red-600">{err}</p>}<button className="w-full bg-blue-600 text-white p-3 rounded font-bold">Continue</button></form><button onClick={()=>go(mode==='login'?'/register':'/login')} className="mt-4 text-blue-600">{mode==='login'?'Create seller account':'Already registered? Login'}</button></div>}
function Listing({id}){const [x,setX]=useState(null),[form,setForm]=useState({name:'',email:'',phone:'',quantity:1,shippingAddress:{line1:'',city:'',state:'',postalCode:'',country:'US'}}),[err,setErr]=useState('');useEffect(()=>{api('/listing/'+id).then(setX).catch(e=>setErr(e.message))},[id]);if(err)return <Msg text={err}/>;if(!x)return <Msg text="Loading..."/>;async function buy(){try{const d=await api('/checkout',{method:'POST',body:JSON.stringify({...form,listingId:x.id})});location.href=d.url}catch(e){setErr(e.message)}}return <div className="max-w-6xl mx-auto p-4 py-8 grid md:grid-cols-2 gap-8"><div><img className="w-full rounded-xl border aspect-square object-cover" src={x.images?.[0]||'https://placehold.co/800x800?text=Item'}/></div><div><p className="text-sm text-slate-500">{x.category} · {x.condition}</p><h1 className="text-3xl font-black mt-2">{x.title}</h1><p className="text-3xl font-black mt-4">{money(x.price_cents)}</p><button onClick={()=>go('/seller/'+x.username)} className="mt-3 text-blue-600">Sold by {x.display_name}</button><p className="my-5 whitespace-pre-wrap">{x.description}</p><div className="bg-white border rounded-xl p-5 space-y-3"><h2 className="font-bold">Fast guest checkout</h2>{['name','email','phone'].map(k=><input key={k} className="w-full border p-3 rounded" placeholder={k==='phone'?'Phone (optional)':k[0].toUpperCase()+k.slice(1)} onChange={e=>setForm({...form,[k]:e.target.value})}/>)}{['line1','city','state','postalCode','country'].map(k=><input key={k} className="w-full border p-3 rounded" placeholder={k==='line1'?'Shipping address':k} value={form.shippingAddress[k]} onChange={e=>setForm({...form,shippingAddress:{...form.shippingAddress,[k]:e.target.value}})}/>)}<input className="w-full border p-3 rounded" type="number" min="1" max={x.quantity} value={form.quantity} onChange={e=>setForm({...form,quantity:Number(e.target.value)})}/>{err&&<p className="text-red-600">{err}</p>}<button onClick={buy} className="w-full bg-blue-600 text-white p-3 rounded font-bold">Buy Now with Stripe</button></div></div></div>}
function SellerStore({username}){const [d,setD]=useState(null),[err,setErr]=useState('');useEffect(()=>{api('/seller/'+username).then(setD).catch(e=>setErr(e.message))},[username]);if(err)return <Msg text={err}/>;if(!d)return <Msg text="Loading..."/>;return <div className="max-w-7xl mx-auto px-4 py-10"><div className="bg-white border rounded-xl p-6 flex gap-4 items-center"><img className="w-20 h-20 rounded-full object-cover bg-slate-100" src={d.seller.logo_url||'https://placehold.co/160?text=Seller'}/><div><h1 className="text-3xl font-black">{d.seller.display_name}</h1><p>@{d.seller.username}</p><p className="mt-2 text-slate-600">{d.seller.description}</p></div></div><h2 className="text-2xl font-bold mt-8 mb-4">Seller listings</h2>{d.listings.length?<div className="grid grid-cols-2 md:grid-cols-4 gap-4">{d.listings.map(x=><Card key={x.id} x={{...x,display_name:d.seller.display_name}}/>)}</div>:<Msg text="No active items available."/>}</div>}
function Sell(){return <Protected><SellerDashboard createOnly/></Protected>}
function SellerDashboard({createOnly=false}){const [d,setD]=useState(null),[f,setF]=useState({title:'',description:'',category:'Other',condition:'Used',price:'',quantity:1,images:[]}),[msg,setMsg]=useState('');const load=()=>api('/seller/dashboard').then(setD).catch(e=>setMsg(e.message));useEffect(load,[]);async function submit(e){e.preventDefault();try{await api('/seller/listings',{method:'POST',body:JSON.stringify({...f,images:String(f.images).split(',').map(s=>s.trim()).filter(Boolean)})});setMsg('Listing created');load()}catch(e){setMsg(e.message)}}if(!d&&!msg)return <Msg text="Loading..."/>;return <div className="max-w-7xl mx-auto px-4 py-8"><div className="flex flex-wrap justify-between gap-3"><h1 className="text-3xl font-black">Seller dashboard</h1>{d?.user?.username&&<button onClick={()=>navigator.clipboard.writeText(location.origin+'/seller/'+d.user.username)} className="border px-4 py-2 rounded">Copy seller link</button>}</div>{!createOnly&&d&&<div className="grid grid-cols-2 md:grid-cols-4 gap-3 mt-6">{[['Total sales',d.totals.total_sales],['Pending payout',d.totals.pending_payout],['Paid payout',d.totals.paid_payout],['Platform fees',d.totals.platform_fees]].map(a=><div className="bg-white border p-4 rounded-xl"><p className="text-sm text-slate-500">{a[0]}</p><b className="text-xl">{money(a[1])}</b></div>)}</div>}<form onSubmit={submit} className="bg-white border rounded-xl p-5 mt-6 grid md:grid-cols-2 gap-3"><h2 className="font-bold text-xl md:col-span-2">Create listing</h2><input className="border p-3 rounded" placeholder="Title" onChange={e=>setF({...f,title:e.target.value})}/><input className="border p-3 rounded" placeholder="Price in USD" type="number" step="0.01" onChange={e=>setF({...f,price:e.target.value})}/><select className="border p-3 rounded" onChange={e=>setF({...f,category:e.target.value})}><option>Other</option><option>Collectibles</option><option>Electronics</option><option>Fashion</option><option>Home</option></select><select className="border p-3 rounded" onChange={e=>setF({...f,condition:e.target.value})}><option>Used</option><option>New</option><option>Refurbished</option></select><input className="border p-3 rounded" type="number" min="0" placeholder="Quantity" onChange={e=>setF({...f,quantity:Number(e.target.value)})}/><input className="border p-3 rounded" placeholder="Image URLs, comma separated" onChange={e=>setF({...f,images:e.target.value})}/><textarea className="border p-3 rounded md:col-span-2" placeholder="Description" onChange={e=>setF({...f,description:e.target.value})}/><button className="bg-blue-600 text-white p-3 rounded font-bold md:col-span-2">Publish listing</button>{msg&&<p>{msg}</p>}</form>{!createOnly&&d&&<><h2 className="text-xl font-bold mt-8">Your listings</h2><div className="overflow-auto bg-white border rounded-xl mt-3"><table className="w-full text-sm"><tbody>{d.listings.map(x=><tr className="border-b"><td className="p-3">{x.title}</td><td>{money(x.price_cents)}</td><td>{x.quantity} left</td><td><button onClick={async()=>{await api('/seller/listings/'+x.id,{method:'PATCH',body:JSON.stringify({active:!x.active})});load()}} className="text-blue-600">{x.active?'Deactivate':'Activate'}</button></td></tr>)}</tbody></table></div><h2 className="text-xl font-bold mt-8">Orders</h2><Table rows={d.orders}/></>}</div>}
function Admin(){const [d,setD]=useState(null),[fee,setFee]=useState(15),[err,setErr]=useState('');const load=()=>api('/admin/overview').then(x=>{setD(x);setFee(x.settings.find(s=>s.key==='platform_fee_percent')?.value||15)}).catch(e=>setErr(e.message));useEffect(load,[]);if(err)return <Msg text={err}/>;if(!d)return <Msg text="Loading admin..."/>;return <div className="max-w-7xl mx-auto p-4 py-8"><h1 className="text-3xl font-black">Admin dashboard</h1><div className="bg-white border rounded-xl p-4 my-6 flex gap-3 items-end"><label>Platform fee %<input className="block border p-2 rounded" value={fee} onChange={e=>setFee(e.target.value)}/></label><button onClick={async()=>{await api('/admin/settings',{method:'PUT',body:JSON.stringify({platformFeePercent:fee})});load()}} className="bg-slate-900 text-white p-2 rounded">Save</button></div>{[['Users',d.users],['Sellers',d.sellers],['Listings',d.listings],['Orders / payments',d.orders],['Payout ledger',d.payouts]].map(([name,rows])=><section className="mt-8"><h2 className="text-xl font-bold mb-2">{name}</h2><Table rows={rows}/></section>)}</div>}
function Table({rows}){if(!rows?.length)return <div className="bg-white border rounded-xl p-5">No records.</div>;const keys=Object.keys(rows[0]).slice(0,8);return <div className="overflow-auto bg-white border rounded-xl"><table className="w-full text-xs"><thead><tr>{keys.map(k=><th className="text-left p-3 bg-slate-50">{k}</th>)}</tr></thead><tbody>{rows.map((r,i)=><tr className="border-t">{keys.map(k=><td className="p-3 max-w-xs truncate">{typeof r[k]==='object'?JSON.stringify(r[k]):String(r[k]??'')}</td>)}</tr>)}</tbody></table></div>}
function Protected({children,admin=false}){const ctx=window.__app;if(!ctx.user){go('/login');return null}if(admin&&ctx.user.role!=='admin')return <Msg text="Unauthorized admin access"/>;return children}
function Msg({text}){return <div className="max-w-2xl mx-auto m-10 bg-white border rounded-xl p-10 text-center">{text}</div>}
function App(){const [path,setPath]=useState(location.pathname),[user,setUser]=useState(null),[ready,setReady]=useState(false);useEffect(()=>{const h=()=>setPath(location.pathname);addEventListener('popstate',h);api('/me').then(x=>setUser(x.user)).finally(()=>setReady(true));return()=>removeEventListener('popstate',h)},[]);window.__app={user};if(!ready)return <Msg text="Loading..."/>;let page;if(path==='/')page=<Home/>;else if(path==='/login')page=<Auth mode="login" setUser={setUser}/>;else if(path==='/register')page=<Auth mode="register" setUser={setUser}/>;else if(path==='/sell')page=<Sell/>;else if(path==='/seller/dashboard')page=<Protected><SellerDashboard/></Protected>;else if(path.startsWith('/seller/'))page=<SellerStore username={decodeURIComponent(path.split('/')[2])}/>;else if(path.startsWith('/listing/'))page=<Listing id={decodeURIComponent(path.split('/')[2])}/>;else if(path.startsWith('/checkout/success'))page=<Msg text="Payment received. Your order confirmation will be emailed after Stripe verifies payment."/>;else if(path.startsWith('/checkout/cancel'))page=<Msg text="Checkout cancelled. Your card was not charged."/>;else if(path.startsWith('/admin'))page=<Protected admin><Admin/></Protected>;else page=<Msg text="Page not found"/>;return <Layout user={user} setUser={setUser}>{page}</Layout>}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
