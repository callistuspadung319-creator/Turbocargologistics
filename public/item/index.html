<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Buy card | TurboMarket</title><script src="https://cdn.tailwindcss.com"></script><style>body{background:#f8fafc}input{font-size:16px!important}</style></head><body class="text-slate-900"><header class="sticky top-0 z-30 bg-white border-b"><div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between"><a href="/" class="text-2xl font-black text-blue-700">TurboMarket</a><a href="/" class="font-semibold">Back to listings</a></div></header><main class="max-w-6xl mx-auto px-4 py-8"><div id="message" class="bg-white border rounded-2xl p-10 text-center">Loading listing…</div><div id="content" class="hidden grid md:grid-cols-2 gap-8"><div><img id="image" class="w-full aspect-square object-cover rounded-2xl border bg-white"><div id="thumbs" class="grid grid-cols-4 gap-2 mt-3"></div></div><div><p id="meta" class="text-sm text-slate-500"></p><h1 id="title" class="text-3xl sm:text-4xl font-black mt-2"></h1><p id="price" class="text-3xl font-black mt-4"></p><a id="seller" class="inline-block text-blue-700 font-semibold mt-3"></a><p id="description" class="whitespace-pre-wrap mt-5 text-slate-700"></p><section class="bg-white border rounded-2xl p-5 mt-6"><h2 class="text-xl font-black">Guest checkout</h2><p class="text-sm text-slate-500 mt-1">No buyer account required.</p><div class="space-y-3 mt-4"><input id="name" class="w-full border p-3 rounded-xl" placeholder="Full name"><input id="email" type="email" class="w-full border p-3 rounded-xl" placeholder="Email"><input id="phone" class="w-full border p-3 rounded-xl" placeholder="Phone (optional)"><input id="line1" class="w-full border p-3 rounded-xl" placeholder="Shipping address"><div class="grid grid-cols-2 gap-3"><input id="city" class="border p-3 rounded-xl" placeholder="City"><input id="state" class="border p-3 rounded-xl" placeholder="State"></div><div class="grid grid-cols-2 gap-3"><input id="postal" class="border p-3 rounded-xl" placeholder="Postal code"><input id="country" value="US" class="border p-3 rounded-xl" placeholder="Country"></div><div><label class="font-semibold">Quantity</label><input id="qty" type="number" min="1" value="1" class="w-full border p-3 rounded-xl mt-1"></div><div id="error" class="hidden bg-red-50 border border-red-200 text-red-700 p-3 rounded-xl"></div><button id="buy" class="w-full bg-blue-600 text-white p-4 rounded-xl font-black text-lg">Buy Now with Stripe</button></div></section></div></div></main><script>const API='/api/marketplace';const id=new URLSearchParams(location.search).get('id');let listing=null;const money=c=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format((Number(c)||0)/100);const $=x=>document.getElementById(x);async function load(){try{if(!id)throw new Error('Missing listing');const r=await fetch(API+'/listing/'+encodeURIComponent(id));const d=await r.json();if(!r.ok)throw new Error(d.error||'Listing unavailable');listing=d;$('message').classList.add('hidden');$('content').classList.remove('hidden');$('image').src=d.images?.[0]||'https://placehold.co/900x900?text=Card';$('title').textContent=d.title;$('price').textContent=money(d.price_cents);$('meta').textContent=d.category+' · '+d.condition+' · '+d.quantity+' available';$('description').textContent=d.description;$('seller').textContent='Sold by '+d.display_name;$('seller').href='/seller/'+encodeURIComponent(d.username);$('qty').max=d.quantity;$('thumbs').innerHTML=(d.images||[]).map(src=>`<button type="button" onclick="document.getElementById('image').src=this.firstChild.src"><img src="${src}" class="aspect-square object-cover rounded-lg border"></button>`).join('')}catch(e){$('message').textContent=e.message}}async function buy(){const error=$('error');error.classList.add('hidden');const payload={listingId:listing.id,name:$('name').value.trim(),email:$('email').value.trim(),phone:$('phone').value.trim(),quantity:Number($('qty').value||1),shippingAddress:{line1:$('line1').value.trim(),city:$('city').value.trim(),state:$('state').value.trim(),postalCode:$('postal').value.trim(),country:$('country').value.trim()}};if(!payload.name||!payload.email||!payload.shippingAddress.line1||!payload.shippingAddress.city||!payload.shippingAddress.state||!payload.shippingAddress.postalCode){error.textContent='Please complete your name, email and shipping address.';error.classList.remove('hidden');return}const button=$('buy');button.disabled=true;button.textContent='Opening secure checkout…';try{const r=await fetch(API+'/checkout',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const d=await r.json();if(!r.ok)throw new Error(d.error||'Checkout failed');location.href=d.url}catch(e){error.textContent=e.message;error.classList.remove('hidden');button.disabled=false;button.textContent='Buy Now with Stripe'}}$('buy').onclick=buy;load();</script></body></html>
