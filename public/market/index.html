<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>TurboMarket | Browse Sports Cards</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}button,a{touch-action:manipulation}</style>
</head>
<body class="bg-slate-50 text-slate-900">
<header class="sticky top-0 z-30 bg-white border-b"><div class="max-w-7xl mx-auto px-4 min-h-16 py-3 flex items-center justify-between gap-3"><a href="/" class="text-2xl sm:text-3xl font-black text-blue-700">TurboMarket</a><nav class="flex flex-wrap justify-end items-center gap-3 text-sm sm:text-base"><a href="/" class="font-bold text-blue-700">Browse</a><a href="/sell" class="font-semibold">Sell</a><a href="/seller/dashboard" class="font-semibold">Dashboard</a><a href="/login" class="bg-slate-900 text-white px-3 py-2 rounded-lg">Login</a></nav></div></header>
<main>
<section class="bg-gradient-to-br from-blue-700 to-indigo-800 text-white"><div class="max-w-5xl mx-auto px-4 py-12 text-center"><h1 class="text-4xl sm:text-6xl font-black">Browse sports cards</h1><p class="mt-3 text-blue-100">Live active listings from every TurboMarket seller.</p><div class="mt-7 bg-white rounded-2xl p-2 flex flex-col sm:flex-row gap-2 shadow-xl"><input id="search" class="flex-1 p-3 text-slate-900 rounded-xl outline-none" placeholder="Search player, year, set or card"><select id="category" class="p-3 text-slate-900 rounded-xl"><option value="">All categories</option><option>Sports Cards</option><option>Football Cards</option><option>Basketball Cards</option><option>Baseball Cards</option><option>Soccer Cards</option><option>Other Collectibles</option></select><select id="sort" class="p-3 text-slate-900 rounded-xl"><option value="new">Newest</option><option value="low">Price: Low</option><option value="high">Price: High</option></select></div></div></section>
<section class="max-w-7xl mx-auto px-4 py-8"><div class="flex justify-between items-end gap-3 mb-5"><div><h2 class="text-2xl font-black">Marketplace feed</h2><p id="count" class="text-sm text-slate-500 mt-1">Loading active listings…</p></div><button id="refresh" class="border bg-white px-3 py-2 rounded-lg font-semibold">Refresh</button></div><div id="error" class="hidden bg-red-50 border border-red-200 text-red-700 p-4 rounded-xl mb-5"></div><div id="grid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3 sm:gap-5"></div><div id="empty" class="hidden bg-white border rounded-2xl p-12 text-center"><h3 class="font-bold text-xl">No active listings found</h3><p class="text-slate-500 mt-2">Try clearing the search or category filter.</p></div><div class="text-center mt-8"><button id="more" class="hidden bg-slate-900 text-white px-6 py-3 rounded-xl font-black">Load more cards</button></div></section>
</main>
<footer class="border-t bg-white p-8 text-center text-sm text-slate-500">Secure checkout powered by Stripe · Independent TurboMarket sellers</footer>
<script>
(()=>{'use strict';const API='/api/market-feed',PAGE=12;const state={cards:[],total:0,offset:0,hasMore:false,loading:false};const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));const money=c=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format((Number(c)||0)/100);function card(c){const t=c.title||'Untitled sports card',i=c.image_url||'https://placehold.co/800x800?text=Card',s=c.display_name||c.username||'TurboMarket seller';return `<article class="bg-white border rounded-2xl overflow-hidden shadow-sm flex flex-col"><a href="/listing/${encodeURIComponent(c.id)}"><img loading="lazy" decoding="async" src="${esc(i)}" class="w-full aspect-square object-cover bg-slate-100" alt="${esc(t)}"><div class="p-3 sm:p-4"><p class="text-xs text-slate-500">${esc(c.condition||'Unspecified')} · ${Number(c.quantity)||0} available</p><h3 class="font-bold mt-1 clamp min-h-10">${esc(t)}</h3><p class="text-xl font-black mt-2">${money(c.price_cents)}</p><p class="text-xs text-blue-700 mt-2">Sold by ${esc(s)}</p></div></a><a href="/listing/${encodeURIComponent(c.id)}" class="m-3 mt-auto bg-blue-600 text-white py-3 rounded-xl font-black text-center">View & Buy</a></article>`}function render(){ $('grid').innerHTML=state.cards.map(card).join('');$('count').textContent=`Showing ${state.cards.length} of ${state.total} active listing${state.total===1?'':'s'}`;$('empty').classList.toggle('hidden',state.total!==0);$('more').classList.toggle('hidden',!state.hasMore)}async function load(reset=false){if(state.loading)return;if(reset){state.cards=[];state.offset=0;state.total=0;state.hasMore=false;$('grid').innerHTML=''}state.loading=true;$('refresh').disabled=true;$('more').disabled=true;$('error').classList.add('hidden');$('count').textContent=reset?'Loading first cards…':'Loading more cards…';try{const p=new URLSearchParams({q:$('search').value.trim(),category:$('category').value,sort:$('sort').value,limit:String(PAGE),offset:String(state.offset),ts:String(Date.now())});const r=await fetch(API+'?'+p,{cache:'no-store',credentials:'include',headers:{Accept:'application/json','Cache-Control':'no-store'}});const d=await r.json().catch(()=>null);if(!r.ok||!d?.ok)throw new Error(d?.detail||d?.error||`Feed request failed (${r.status})`);state.cards=reset?d.items:[...state.cards,...d.items];state.total=Number(d.total||0);state.offset=state.cards.length;state.hasMore=Boolean(d.hasMore);render()}catch(e){$('error').textContent=e.message||String(e);$('error').classList.remove('hidden');$('count').textContent='Marketplace unavailable'}finally{state.loading=false;$('refresh').disabled=false;$('more').disabled=false}}let timer;$('search').addEventListener('input',()=>{clearTimeout(timer);timer=setTimeout(()=>load(true),350)});$('category').addEventListener('change',()=>load(true));$('sort').addEventListener('change',()=>load(true));$('refresh').addEventListener('click',()=>load(true));$('more').addEventListener('click',()=>load(false));window.addEventListener('pageshow',()=>{if(!state.cards.length)load(true)});load(true)})();
</script>
</body>
</html>
