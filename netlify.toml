[build]
  publish = "public"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Buyer marketplace homepage.
[[redirects]]
  from = "/"
  to = "/market/index.html"
  status = 200
  force = true

# Dedicated listing page with guest Stripe checkout.
[[redirects]]
  from = "/listing/*"
  to = "/item/index.html?id=:splat"
  status = 200
  force = true

# Stripe return pages.
[[redirects]]
  from = "/checkout/success"
  to = "/checkout/success/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/checkout/cancel"
  to = "/checkout/cancel/index.html"
  status = 200
  force = true

# Dedicated seller pages must be resolved before the SPA fallback.
[[redirects]]
  from = "/sell"
  to = "/sell/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/sell/"
  to = "/sell/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/seller/dashboard"
  to = "/seller/dashboard/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/seller/dashboard/"
  to = "/seller/dashboard/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Never serve an old scanner or stale comps response.
[[headers]]
  for = "/sell"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, max-age=0"
    Pragma = "no-cache"
    Expires = "0"

[[headers]]
  for = "/sell/*"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, max-age=0"
    Pragma = "no-cache"
    Expires = "0"

[[headers]]
  for = "/api/seller-tools/*"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, max-age=0"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
