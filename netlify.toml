[build]
  publish = "public"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# One canonical marketplace document for every buyer entry URL.
[[redirects]]
  from = "/"
  to = "/market/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/market"
  to = "/market/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/market/"
  to = "/market/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/marketplace-live"
  to = "/market/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/marketplace-live/"
  to = "/market/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/marketplace"
  to = "/market/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/marketplace/"
  to = "/market/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/browse"
  to = "/market/index.html"
  status = 200
  force = true

# Canonical listing page.
[[redirects]]
  from = "/listing/*"
  to = "/item/index.html?id=:splat"
  status = 200
  force = true

[[redirects]]
  from = "/item/*"
  to = "/item/index.html?id=:splat"
  status = 200
  force = true

[[redirects]]
  from = "/checkout/success"
  to = "/checkout/success/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/checkout/cancel"
  to = "/checkout/cancel/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/sell"
  to = "/sell/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/sell/"
  to = "/sell/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/seller/dashboard"
  to = "/seller/dashboard/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/seller/dashboard/"
  to = "/seller/dashboard/index.html"
  status = 200
  force = true

# Remaining authentication, seller storefront and admin routes use the SPA.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Dynamic pages and APIs must never be served stale.
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, max-age=0"
    Pragma = "no-cache"
    Expires = "0"

[[headers]]
  for = "/market*"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, max-age=0"
    Pragma = "no-cache"
    Expires = "0"

[[headers]]
  for = "/browse"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, max-age=0"

[[headers]]
  for = "/sell*"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, max-age=0"
    Pragma = "no-cache"
    Expires = "0"

[[headers]]
  for = "/seller/dashboard*"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, max-age=0"
    Pragma = "no-cache"
    Expires = "0"

[[headers]]
  for = "/listing/*"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, max-age=0"

[[headers]]
  for = "/item/*"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, max-age=0"

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, max-age=0"
    Pragma = "no-cache"
    Expires = "0"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
