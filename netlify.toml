[build]
  publish = "public"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Canonical buyer marketplace feed.
[[redirects]]
  from = "/marketplace"
  to = "/market/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/marketplace/"
  to = "/market/index.html"
  status = 200
  force = true

# Send the domain root to the canonical marketplace URL. Use a real redirect,
# not an internal rewrite, so the legacy React homepage can never handle '/'.
[[redirects]]
  from = "/"
  to = "/marketplace"
  status = 302
  force = true

[[redirects]]
  from = "/browse"
  to = "/marketplace"
  status = 302
  force = true

# Canonical listing page with guest Stripe checkout.
[[redirects]]
  from = "/listing/*"
  to = "/item/index.html?id=:splat"
  status = 200
  force = true

# Legacy item URLs remain supported.
[[redirects]]
  from = "/item/*"
  to = "/item/index.html?id=:splat"
  status = 200
  force = true

[[redirects]]
  from = "/checkout/success"
  to = "/checkout/success/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/checkout/cancel"
  to = "/checkout/cancel/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/sell"
  to = "/sell/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/sell/"
  to = "/sell/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/seller/dashboard"
  to = "/seller/dashboard/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/seller/dashboard/"
  to = "/seller/dashboard/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/marketplace*"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, max-age=0"
    Pragma = "no-cache"
    Expires = "0"

[[headers]]
  for = "/sell*"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, max-age=0"
    Pragma = "no-cache"
    Expires = "0"

[[headers]]
  for = "/seller/dashboard*"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, max-age=0"
    Pragma = "no-cache"
    Expires = "0"

[[headers]]
  for = "/listing/*"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, max-age=0"

[[headers]]
  for = "/item/*"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, max-age=0"

[[headers]]
  for = "/api/cards*"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, max-age=0"

[[headers]]
  for = "/api/marketplace*"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, max-age=0"

[[headers]]
  for = "/api/seller-tools*"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, max-age=0"

[[headers]]
  for = "/api/listing-delete/*"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, max-age=0"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
